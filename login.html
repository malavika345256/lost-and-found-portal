```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Alliance University</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #304574;

            background:
                linear-gradient(
                    rgba(18, 35, 65, 0.45),
                    rgba(18, 35, 65, 0.45)
                ),
                url("campus.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .login-box {
            width: min(500px, 92vw);
            padding: 32px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 36px;
            color: #304574;
        }

        .subtitle {
            margin: 0 0 20px;
            text-align: center;
            color: #64748b;
            font-size: 21px;
            line-height: 1.35;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-size: 16px;
            font-weight: bold;
            color: #304574;
        }

        input {
            display: block;
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #304574;
            box-shadow: 0 0 0 3px rgba(48, 69, 116, 0.12);
        }

        button {
            width: 100%;
            height: 54px;
            margin-top: 18px;
            padding: 0 16px;
            border: none;
            border-radius: 9px;
            background: #304574;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #22365c;
        }

        #errorMessage {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            margin-top: 16px;
            text-align: center;
            color: #304574;
            text-decoration: none;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                min-height: 100svh;
                padding: 16px 0;
                background-attachment: scroll;
            }

            .login-box {
                width: 92vw;
                padding: 28px 22px;
            }

            h1 {
                font-size: clamp(30px, 8vw, 36px);
            }

            .subtitle {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="login-box">

        <h1>Alliance University</h1>

        <div class="subtitle">
            Student Login<br>
            Lost &amp; Found Portal
        </div>

        <form id="loginForm">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login as Student</button>

            <div id="errorMessage" role="alert"></div>

        </form>

        <a class="back-link" href="register.html">
            Register as a student
        </a>
        <a class="back-link" href="admin.html">
            Administrator login
        </a>

    </main>

    <script src="portal.js"></script>

</body>
</html>
```
